name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # CI placeholder env — real values are not needed for static checks/build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      SUPABASE_SECRET_KEY: sb_secret_placeholder
      SUPABASE_STORAGE_BUCKET: scribbl-files
      LIVEBLOCKS_SECRET_KEY: sk_dev_placeholder
      LIVEKIT_URL: wss://placeholder.livekit.cloud
      LIVEKIT_API_KEY: placeholder
      LIVEKIT_API_SECRET: placeholder
      RESEND_API_KEY: re_placeholder
      EMAIL_FROM: Scribbl <noreply@scribblapp.ca>
      APP_URL: http://localhost:3000
      RECORDINGS_S3_ENDPOINT: https://placeholder.supabase.co/storage/v1/s3
      RECORDINGS_S3_REGION: us-east-2
      RECORDINGS_S3_BUCKET: scribbl-recordings
      RECORDINGS_S3_ACCESS_KEY: placeholder
      RECORDINGS_S3_SECRET_KEY: placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_PRICE_PRO_BASE_CAD: price_placeholder_pro_base
      STRIPE_PRICE_INSTITUTION_BASE_CAD: price_placeholder_institution_base
      STRIPE_PRICE_PRO_MEMBER_OVERAGE_CAD: price_placeholder_pro_overage
      STRIPE_PRICE_INSTITUTION_MEMBER_OVERAGE_CAD: price_placeholder_institution_overage
      STRIPE_PRICE_RECORDING_OVERAGE_CAD: price_placeholder_recording_overage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
